[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stienen-rs485-gateway"
version = "1.0.0"
description = "RS485 Gateway for Stienen Controllers"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Stienen Gateway Team", email = "team@company.com"},
]
maintainers = [
    {name = "Stienen Gateway Team", email = "team@company.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10", 
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering",
    "Framework :: AsyncIO",
]
dependencies = [
    "pyserial>=3.5",
    "crcmod>=1.7",
    "pydantic>=1.10.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
]
mqtt = [
    "paho-mqtt>=1.6.0",
    "asyncio-mqtt>=0.13.0",
]
database = [
    "asyncpg>=0.28.0",
    "sqlalchemy>=2.0.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "psutil>=5.9.0",
    "coloredlogs>=15.0",
]

[project.urls]
Homepage = "https://github.com/company/stienen-gateway"
Repository = "https://github.com/company/stienen-gateway"
Documentation = "https://stienen-gateway.readthedocs.io/"
"Bug Tracker" = "https://github.com/company/stienen-gateway/issues"

[project.scripts]
stienen-gateway = "main:main"
stienen-web = "web_interface:run_web_interface"
stienen-monitor = "monitoring_utilities:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stienen*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint.messages_control]
disable = ["C0330", "C0326", "W0621", "R0903", "R0913", "R0914"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["stienen"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

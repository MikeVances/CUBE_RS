version: '3.8'

services:
  # Основной гейтвей Stienen
  stienen-gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stienen-gateway
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./database:/app/database:ro
    devices:
      - "${RS485_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    environment:
      - STIENEN_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STIENEN_CONFIG=/app/config.json
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-stienen}
      - POSTGRES_USER=${POSTGRES_USER:-stienen}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - MQTT_BROKER_HOST=mqtt-broker
    networks:
      - stienen-net
    depends_on:
      - postgres
      - mqtt-broker
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Веб-интерфейс
  stienen-web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stienen-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs:ro
    command: ["python", "web_interface.py", "web", "--config", "/app/config.json", "--port", "8080"]
    environment:
      - STIENEN_LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - stienen-net
    depends_on:
      - stienen-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/gateway/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: stienen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stienen}
      POSTGRES_USER: ${POSTGRES_USER:-stienen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/initial_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - stienen-net
    command: postgres -c 'max_connections=200' -c 'shared_buffers=128MB'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stienen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT брокер
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: stienen-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/passwd:/mosquitto/config/passwd:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks:
      - stienen-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для кэширования (опционально)
  redis:
    image: redis:7-alpine
    container_name: stienen-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - stienen-net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: stienen-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - stienen-net

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: stienen-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - stienen-net
    depends_on:
      - prometheus

  # Nginx reverse proxy (опционально)
  nginx:
    image: nginx:alpine
    container_name: stienen-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - stienen-net
    depends_on:
      - stienen-web
      - grafana

volumes:
  postgres_data:
    driver: local
  mqtt_data:
    driver: local  
  mqtt_logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  stienen-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

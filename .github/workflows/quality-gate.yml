name: Quality Gate & Security Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.6.1'

jobs:
  # === SECURITY SCANNING ===
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      run: poetry install --with dev,test
      
    - name: Run Bandit security scan
      run: |
        poetry run bandit -r . \
          -x tests/ \
          -f sarif \
          -o bandit-results.sarif
      continue-on-error: true
      
    - name: Upload Bandit results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: bandit-results.sarif
        
    - name: Run Safety vulnerability check
      run: |
        poetry run safety check --json --output safety-results.json
      continue-on-error: true
      
    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
        
    - name: SAST Scan with CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: python
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # === CODE QUALITY ===
  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      run: poetry install --with dev,test
      
    - name: Run Ruff linting
      run: |
        echo "::group::Ruff Linting"
        poetry run ruff check . --format=github
        echo "::endgroup::"
        
    - name: Run Black code formatting check
      run: |
        echo "::group::Black Formatting"
        poetry run black --check --diff .
        echo "::endgroup::"
        
    - name: Run isort import sorting check
      run: |
        echo "::group::isort Import Sorting"
        poetry run isort --check-only --diff .
        echo "::endgroup::"
        
    - name: Run MyPy type checking
      run: |
        echo "::group::MyPy Type Checking"
        poetry run mypy . --install-types --non-interactive
        echo "::endgroup::"
        
    - name: Upload type checking results
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: mypy-report
        path: mypy-report/

  # === TESTING ===
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        
    - name: Install dependencies
      run: poetry install --with dev,test
      
    - name: Create test database
      run: |
        mkdir -p test_data
        touch test_data/test.db
        
    - name: Run unit tests
      run: |
        poetry run pytest tests/unit/ \
          --cov=. \
          --cov-report=xml \
          --cov-report=html:htmlcov \
          --cov-fail-under=70 \
          --junitxml=pytest.xml \
          -v
      env:
        DATABASE_URL: sqlite:///test_data/test.db
        TELEGRAM_BOT_TOKEN: "dummy_token_for_tests"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
        verbose: true
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          pytest.xml
          htmlcov/

  # === INTEGRATION TESTS ===
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      # In future: add real Modbus simulator
      test-db:
        image: alpine:latest
        options: --entrypoint sh
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      
    - name: Install dependencies
      run: poetry install --with dev,test
      
    - name: Run integration tests
      run: |
        poetry run pytest tests/integration/ \
          -v \
          --tb=short
      env:
        DATABASE_URL: sqlite:///test_integration.db
        ENVIRONMENT: testing

  # === DOCKER BUILD ===
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    if: github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: cube-rs:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        
    - name: Run Docker security scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: cube-rs:${{ github.sha }}
        format: sarif
        output: docker-trivy-results.sarif
        
    - name: Upload Docker security scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: docker-trivy-results.sarif

  # === PERFORMANCE TESTING ===
  performance-test:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install --with dev,test
        
    - name: Run performance tests
      run: |
        poetry run pytest tests/performance/ \
          --benchmark-only \
          --benchmark-json=benchmark.json
          
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark.json

  # === DEPLOYMENT READINESS ===
  deployment-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: [test, integration-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate deployment configurations
      run: |
        # Check required files exist
        test -f pyproject.toml
        test -f .env.example
        test -f requirements.txt
        
        # Validate YAML configurations
        python -c "import yaml; yaml.safe_load(open('.github/workflows/quality-gate.yml'))"
        
        echo "✅ All deployment checks passed"
        
    - name: Security baseline check
      run: |
        echo "Checking security baseline..."
        
        # Verify no secrets in code
        if grep -r "password\|secret\|token\|key" --include="*.py" --exclude-dir=tests . | grep -v "ENV\|getenv\|os.environ"; then
          echo "❌ Found potential secrets in code"
          exit 1
        fi
        
        # Check .gitignore includes sensitive files
        if ! grep -q ".env" .gitignore; then
          echo "❌ .env not in .gitignore"
          exit 1
        fi
        
        echo "✅ Security baseline checks passed"

  # === NOTIFICATION ===
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, integration-test, docker-build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Notify success
      if: ${{ needs.security-scan.result == 'success' && needs.code-quality.result == 'success' && needs.test.result == 'success' }}
      run: |
        echo "🎉 All quality gates passed!"
        echo "✅ Security scan: passed"
        echo "✅ Code quality: passed"
        echo "✅ Tests: passed"
        echo "✅ Ready for deployment"
        
    - name: Notify failure
      if: ${{ needs.security-scan.result == 'failure' || needs.code-quality.result == 'failure' || needs.test.result == 'failure' }}
      run: |
        echo "❌ Quality gate failure detected!"
        echo "Security scan: ${{ needs.security-scan.result }}"
        echo "Code quality: ${{ needs.code-quality.result }}"
        echo "Tests: ${{ needs.test.result }}"
        exit 1
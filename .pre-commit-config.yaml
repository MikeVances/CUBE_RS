# CUBE_RS Pre-commit Configuration
# Автоматические проверки качества кода перед каждым коммитом

repos:
  # ===== БАЗОВЫЕ ПРОВЕРКИ =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: 🧹 Remove trailing whitespace
      - id: end-of-file-fixer
        name: 📝 Fix end of files
      - id: check-yaml
        name: ✅ Check YAML
      - id: check-json
        name: ✅ Check JSON
      - id: check-toml
        name: ✅ Check TOML
      - id: check-xml
        name: ✅ Check XML
      - id: check-merge-conflict
        name: 🔍 Check for merge conflicts
      - id: debug-statements
        name: 🐛 Check for debug statements
      - id: check-docstring-first
        name: 📚 Check docstring is first
      - id: check-case-conflict
        name: 🔤 Check case conflicts
      - id: check-added-large-files
        name: 📏 Check for large files
        args: [--maxkb=1000]

  # ===== ФОРМАТИРОВАНИЕ КОДА =====
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        name: 🎨 Format with Black
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: 📋 Sort imports with isort
        args: ["--profile", "black"]

  # ===== КАЧЕСТВО КОДА =====
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        name: 🔍 Lint with Ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ===== ТИПИЗАЦИЯ =====
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: 🏷️ Type check with MyPy
        additional_dependencies: 
          - types-PyYAML
          - types-requests
          - pydantic
          - aiohttp
        args: [--config-file, pyproject.toml]

  # ===== БЕЗОПАСНОСТЬ =====
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: 🔒 Security check with Bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # ===== SECRETS DETECTION =====
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: 🕵️ Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            .*\.lock$|
            config/logs/.*\.log$
          )$

  # ===== ДОКУМЕНТАЦИЯ =====
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: 📖 Check docstrings
        match: "^(?!tests/).*\\.py$"
        args: ["--convention=google"]

  # ===== ТЕСТЫ =====
  - repo: local
    hooks:
      - id: pytest-check
        name: 🧪 Run fast unit tests
        entry: python -m pytest tests/unit -v --tb=short -x --ignore=tests/unit/test_deduplication_security.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      
      - id: deduplication-check
        name: 📊 Check code deduplication
        entry: python scripts/validate_deduplication.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ===== PERFORMANCE =====
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        name: ⬆️ Upgrade Python syntax
        args: [--py311-plus]

# ===== КОНФИГУРАЦИЯ CI =====
ci:
  autofix_commit_msg: |
    🤖 [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '🤖 [pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest-check]  # Skip slow tests in CI pre-commit
  submodules: false
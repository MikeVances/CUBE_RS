system:
  environment: production
  log_level: WARNING
  startup_timeout: 60
  shutdown_timeout: 15
  offline_mode: true
rs485:
  port: /dev/tty.usbserial-2130
  baudrate: 9600
  parity: N
  databits: 8
  stopbits: 1
  timeout: 2.0
  slave_id: 1
  window_duration: 5
  cooldown_duration: 10
modbus_tcp:
  port: 6001
  timeout: 3.0
  max_connections: 10
database:
  file: data/kub_data.db
  commands_db: data/kub_commands.db
  timeout: 5
  journal_mode: WAL
  synchronous: NORMAL
services:
  gateway_enabled: true
  dashboard_enabled: false
  telegram_enabled: true
  websocket_enabled: false
  mqtt_enabled: false
  dashboard_port: 8501
websocket_port: 8765
telegram:
  admin_users: ${TELEGRAM_ADMIN_USERS}
alarm_relay:
  enabled: true
  register: '0x0082'
  bit: 7
  label: Реле аварии
sensors:
  temperature: true
  humidity: true
  co2: false
  nh3: false
  pressure: true
system_outputs:
- enabled: false
  register: '0x0081'
  bit: 0
  label: Группа вентиляторов 1
- enabled: false
  register: '0x0081'
  bit: 1
  label: Группа вентиляторов 2
- enabled: false
  register: '0x0082'
  bit: 0
  label: Освещение
modbus_registers:
  software_version: '0x0301'
  factory_number: '0x0302'
  device_number: '0x0303'
  digital_outputs_1: '0x0081'
  digital_outputs_2: '0x0082'
  digital_outputs_3: '0x00A2'
  pressure: '0x0083'
  humidity: '0x0084'
  co2: '0x0085'
  nh3: '0x0086'
  grv_base: '0x0087'
  grv_tunnel: '0x0088'
  damper: '0x0089'
  air_intake_1: '0x008A'
  air_intake_2: '0x008B'
  air_intake_tunnel: '0x008C'
  air_intake_3: '0x0092'
  air_intake_4: '0x0093'
  temp_inside_1: '0x008D'
  temp_inside_2: '0x008E'
  temp_outside: '0x008F'
  temp_inside_3: '0x0090'
  temp_inside_4: '0x0091'
  lighting_1: '0x0094'
  lighting_2: '0x0095'
  lighting_3: '0x0096'
  lighting_4: '0x0097'
  timer_1_output_1: '0x0098'
  timer_1_output_2: '0x0099'
  timer_1_output_3: '0x009A'
  timer_1_output_4: '0x009B'
  timer_2_output_1: '0x009C'
  timer_2_output_2: '0x009D'
  timer_2_output_3: '0x009E'
  timer_2_output_4: '0x009F'
  active_alarms: '0x00C3'
  registered_alarms: '0x00C7'
  active_warnings: '0x00CB'
  registered_warnings: '0x00CF'
  ventilation_target: '0x00D0'
  ventilation_level: '0x00D1'
  ventilation_scheme: '0x00D2'
  day_counter: '0x00D3'
  temp_target: '0x00D4'
  temp_inside: '0x00D5'
  temp_vent_activation: '0x00D6'
logging:
  level: INFO
  format: '%(asctime)s %(levelname)s [%(name)s] %(message)s'
  files:
    gateway1: logs/gateway1.log
    gateway2: logs/gateway2.log
    dashboard: logs/dashboard.log
    telegram: logs/telegram.log
    websocket: logs/websocket.log
    mqtt: logs/mqtt.log
    system: logs/system.log

[tool.poetry]
name = "cube-rs"
version = "2.0.0"
description = "Industrial IoT Gateway with Modbus TCP/RTU support"
authors = ["Mikhail <mikhail@example.com>"]
readme = "README.md"
packages = [{include = "modbus"}, {include = "telegram_bot"}, {include = "web_app"}, {include = "core"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
aiohttp = "^3.9.0"
aiosqlite = "^0.19.0"
pydantic = "^2.5.0"
streamlit = "^1.28.0"
pymodbus = "^3.5.0"
python-telegram-bot = "^20.7"
pyyaml = "^6.0.1"
cryptography = "^41.0.0"
structlog = "^23.2.0"
prometheus-client = "^0.19.0"
jinja2 = "^3.1.6"
python-multipart = "^0.0.20"
websockets = "^15.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.88.0"
black = "^23.11.0"
isort = "^5.12.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
bandit = "^1.7.5"
pre-commit = "^3.5.0"
types-pyyaml = "^6.0.12"
types-requests = "^2.31.0"

[tool.poetry.group.test.dependencies]
testcontainers = "^3.7.0"
aioresponses = "^0.7.4"
factory-boy = "^3.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# === BLACK CONFIGURATION ===
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# === ISORT CONFIGURATION ===
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["modbus", "telegram_bot", "web_app", "core"]
known_third_party = ["fastapi", "aiohttp", "pydantic", "pytest"]

# === RUFF CONFIGURATION ===
[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "S",  # bandit
    "N",  # pep8-naming
]
ignore = [
    "E501",  # line too long, handled by black
    "S101",  # Use of assert detected (OK in tests)
    "S608",  # Possible SQL injection (we use parameterized queries)
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101", "ARG", "SIM"]
"migrations/**/*" = ["S608"]

# === MYPY CONFIGURATION ===
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pymodbus.*",
    "telegram.*",
    "streamlit.*",
]
ignore_missing_imports = true

# === PYTEST CONFIGURATION ===
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=modbus",
    "--cov=telegram_bot", 
    "--cov=web_app",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# === COVERAGE CONFIGURATION ===
[tool.coverage.run]
source = ["modbus", "telegram_bot", "web_app", "core"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# === BANDIT CONFIGURATION ===
[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]  # Skip assert and shell usage in tests
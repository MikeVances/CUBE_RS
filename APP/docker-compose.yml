version: '3.8'

services:
  cube-rs-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SERVER_URL=${SERVER_URL:-http://server:8080}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - FLASK_ENV=production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - cube-rs-network
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cube-rs-network
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - cube-rs-app
    restart: unless-stopped
    networks:
      - cube-rs-network

volumes:
  redis_data:

networks:
  cube-rs-network:
    driver: bridge
version: '3.8'

services:
  tunnel-broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    container_name: edge-tunnel-broker
    ports:
      - "8080:8080"
      - "8081:8081"  # WebSocket
    environment:
      - BROKER_HOST=0.0.0.0
      - BROKER_PORT=8080
      - WEBSOCKET_PORT=8081
      - DATABASE_PATH=/app/data/tunnel_broker.db
      - LOG_LEVEL=INFO
    volumes:
      - broker_data:/app/data
      - broker_logs:/app/logs
    networks:
      - edge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: edge-web-app
    ports:
      - "5000:5000"
    environment:
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=5000
      - BROKER_URL=http://tunnel-broker:8080
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me}
      - LOG_LEVEL=INFO
    volumes:
      - webapp_logs:/app/logs
    networks:
      - edge_network
    depends_on:
      tunnel-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: edge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - edge_network
    depends_on:
      - tunnel-broker
      - web-app
    restart: unless-stopped

  # PostgreSQL для production (опционально)
  postgres:
    image: postgres:15-alpine
    container_name: edge-postgres
    environment:
      - POSTGRES_DB=tunnel_broker
      - POSTGRES_USER=tunnel_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - edge_network
    restart: unless-stopped
    profiles:
      - production

  # Redis для кэширования (опционально)
  redis:
    image: redis:7-alpine
    container_name: edge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edge_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  broker_data:
    driver: local
  broker_logs:
    driver: local
  webapp_logs:
    driver: local
  nginx_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  edge_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
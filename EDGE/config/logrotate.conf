# Logrotate конфигурация для EDGE
# Копировать в /etc/logrotate.d/cube-edge

/var/log/cube_edge/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    sharedscripts
    copytruncate
    create 0644 cube_edge cube_edge
    
    postrotate
        # Уведомляем приложение о ротации логов (опционально)
        # systemctl reload cube-edge.service 2>/dev/null || true
    endscript
}

/var/log/cube_edge/security.log {
    daily
    missingok
    rotate 90        # Логи безопасности храним дольше
    compress
    delaycompress
    notifempty
    copytruncate
    create 0600 cube_edge cube_edge
    
    postrotate
        # Отправляем уведомление о ротации логов безопасности
        echo "Security log rotated on $(date)" | logger -t cube-edge-security
    endscript
}

# Логи ошибок - особое внимание
/var/log/cube_edge/errors.log {
    daily
    missingok
    rotate 60
    compress
    delaycompress
    notifempty
    copytruncate
    create 0644 cube_edge cube_edge
    maxsize 50M      # Принудительная ротация при превышении размера
    
    postrotate
        # При ротации логов ошибок - проверяем критические ошибки
        if tail -100 /var/log/cube_edge/errors.log.1 | grep -i "critical\|fatal" > /dev/null; then
            echo "Critical errors detected during rotation" | logger -t cube-edge-critical
        fi
    endscript
}